<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatConnect Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">

<header>
<h2>💬 ChatConnect Pro</h2>
<input type="text" id="search" placeholder="Search chats...">
</header>

<div id="chatList">

<div class="chat">
<div class="avatar">👨</div>
<div class="info">
<h3>Rahul</h3>
<p>Hey! How are you?</p>
</div>
<div class="time">10:30</div>
</div>

<div class="chat">
<div class="avatar">👩</div>
<div class="info">
<h3>Priya</h3>
<p>See you tomorrow.</p>
</div>
<div class="time">09:10</div>
</div>

<div class="chat">
<div class="avatar">👨‍💼</div>
<div class="info">
<h3>Office Group</h3>
<p>Meeting starts at 2 PM.</p>
</div>
<div class="time">Yesterday</div>
</div>

<div class="chat">
<div class="avatar">👨‍👩‍👧</div>
<div class="info">
<h3>Family</h3>
<p>Dinner at 8 PM 🍽️</p>
</div>
<div class="time">Yesterday</div>
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
