<!DOCTYPE html>
<html>
<head>
<title>ChatConnect Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

<div id="app">

<header>
<h2>⚙️ Settings</h2>
</header>


<div class="setting">

<label>
👤 Profile Name
</label>

<input id="profileName" placeholder="Your name">

</div>


<div class="setting">

<label>
🌙 Dark Mode</label>

<button onclick="toggleDark()">
Change Mode
</button>

</div>


<div class="setting">

<label>
🎨 Theme Colour</label>

<select id="theme" onchange="changeTheme()">

<option value="#075e54">
Green
</option>

<option value="#1565c0">
Blue
</option>

<option value="#6a1b9a">
Purple
</option>

<option value="#c62828">
Red
</option>

</select>

</div>


<button onclick="saveSettings()">
💾 Save Settings
</button>


<h3 id="status"></h3>


</div>

</div>
<div class="tools">

<button onclick="backupData()">
💾 Backup
</button>

<button onclick="restoreData()">
♻️ Restore
</button>

</div>

<script src="script.js"></script>

</body>
</html>
