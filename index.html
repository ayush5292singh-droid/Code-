<!DOCTYPE html>
<html>
<head>
<title>ChatConnect Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

<!-- Chat List -->
<div id="home">

<header>
<h2>💬 ChatConnect Pro</h2>
<input id="search" placeholder="Search chats">
</header>

<div class="chat" onclick="openChat('Rahul')">
<div class="avatar">👨</div>
<div>
<h3>Rahul</h3>
<p>Hey! How are you?</p>
</div>
</div>


<div class="chat" onclick="openChat('Priya')">
<div class="avatar">👩</div>
<div>
<h3>Priya</h3>
<p>See you tomorrow</p>
</div>
</div>


</div>


<!-- Chat Screen -->
<div id="chatScreen" class="hidden">

<header>
<button onclick="goBack()">⬅️</button>
<h2 id="chatName">Chat</h2>
</header>


<div id="messages"></div>


<div class="inputBox">

<input id="messageInput" placeholder="Type message">

<button onclick="sendMessage()">
Send
</button>

</div>


</div>


</div>


<script src="script.js"></script>

</body>
</html>
